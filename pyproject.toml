[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oulad-early-warning"
version = "0.1.0"
description = "Early-warning modelling on the Open University Learning Analytics Dataset"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
# Added in Phase 3 when we reach gradient boosting and model explanation.
models = ["xgboost>=2.0", "shap>=0.44"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
